name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Chromium and its system libraries are preinstalled, so CI doesn't depend on apt mirrors.
    # Keep the tag in step with the playwright version in package-lock.json.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
